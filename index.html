<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adaptive Circuit Control System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            color: white;
        }

        h2 {
            color: #38bdf8;
        }

        .value-box {
            font-size: 20px;
            font-weight: bold;
            color: gold;
        }

        canvas {
            background: #111827;
            border-radius: 10px;
        }

        /* Animation */
        .glow {
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 5px #22c55e;
            }

            to {
                box-shadow: 0 0 20px #22c55e;
            }
        }
    </style>
</head>

<body>
    <div class="container mt-4">

        <h2 class="text-center mb-4">
            Adaptive Circuit Control System Dashboard
        </h2>

        <!-- Electrical Parameter Cards -->
        <div class="row text-center g-3">

            <div class="col-md-3 col-6">
                <div class="card p-3 glow">
                    Voltage<br>
                    <span id="voltage" class="value-box">0</span> V
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="card p-3 glow">
                    Current<br>
                    <span id="current" class="value-box">0</span> A
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="card p-3 glow">
                    Power<br>
                    <span id="power" class="value-box">0</span> W
                </div>
            </div>

            <div class="col-md-3 col-6">
                <div class="card p-3 glow">
                    Power<br>
                    <span id="pf" class="value-box">0</span> W
                </div>
            </div>

        </div>

        <!-- Voltage and Current Graphs -->
        <div class="row mt-4 g-3">

            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Voltage Graph</h5>
                    <canvas id="voltageChart"></canvas>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Current Graph</h5>
                    <canvas id="currentChart"></canvas>
                </div>
            </div>

        </div>

        <!-- Power Graph and Fault Status -->
        <div class="row mt-4 g-3">

            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Power Graph</h5>
                    <canvas id="powerChart"></canvas>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-3">
                    <h5>AI Decision</h5>
                    <h3 id="status" class="text-success">
                        NORMAL
                    </h3>
                    <p id="message">Monitoring electrical parameters...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Data arrays
        const labels = [];
        const voltageData = [];
        const currentData = [];
        const powerData = [];

        // Common chart configuration
        function createChart(canvasId, label, data, color) {
            return new Chart(document.getElementById(canvasId), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: color,
                        backgroundColor: color,
                        borderWidth: 2,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: "white"
                            },
                            grid: {
                                color: "#374151"
                            }
                        },
                        x: {
                            ticks: {
                                color: "white",
                                maxRotation: 45
                            },
                            grid: {
                                color: "#374151"
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: "white"
                            }
                        }
                    }
                }
            });
        }

        // Create charts
        const voltageChart = createChart(
            "voltageChart",
            "Voltage (V)",
            voltageData,
            "#38bdf8"
        );

        const currentChart = createChart(
            "currentChart",
            "Current (A)",
            currentData,
            "#22c55e"
        );

        const powerChart = createChart(
            "powerChart",
            "Power (W)",
            powerData,
            "#f59e0b"
        );

        // Simulate electrical readings every second
        setInterval(() => {

            const voltage = Number(
                (220 + Math.random() * 20).toFixed(1)
            );

            const current = Number(
                (2 + Math.random() * 3).toFixed(2)
            );

            const power = Number(
                (voltage * current).toFixed(1)
            );

            const pf = Number(
                (0.8 + Math.random() * 0.2).toFixed(2)
            );

            // Update parameter cards
            document.getElementById("voltage").textContent = voltage;
            document.getElementById("current").textContent = current;
            document.getElementById("power").textContent = power;
            document.getElementById("pf").textContent = pf;

            // Threshold-based fault detection
            let status = "NORMAL";
            let color = "#22c55e";
            let message = "Electrical parameters are within limits.";

            if (voltage > 240 || current > 4) {
                status = "FAULT DETECTED";
                color = "#ef4444";
                message = "Warning: Voltage or current exceeded the configured limit.";
            }

            const statusElement = document.getElementById("status");
            statusElement.textContent = status;
            statusElement.style.color = color;

            document.getElementById("message").textContent = message;

            // Update graphs
            const time = new Date().toLocaleTimeString();

            labels.push(time);
            voltageData.push(voltage);
            currentData.push(current);
            powerData.push(power);

            // Keep the latest 10 readings
            if (labels.length > 10) {
                labels.shift();
                voltageData.shift();
                currentData.shift();
                powerData.shift();
            }

            voltageChart.update();
            currentChart.update();
            powerChart.update();

        }, 1000);
    </script>
</body>
</html>
